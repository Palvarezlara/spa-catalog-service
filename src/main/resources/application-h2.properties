# Perfil de desarrollo local sin MySQL:  SPRING_PROFILES_ACTIVE=h2
spring.datasource.url=jdbc:h2:mem:spa_catalog;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-0123456789}
