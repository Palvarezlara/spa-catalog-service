# =====================================================================
# spa-catalog-service  (servicios del SPA, terapeutas y blogs)
# Toda la configuracion sensible llega por variables de entorno.
# Perfil "h2": base en memoria para desarrollo / pruebas (sin MySQL).
# =====================================================================
spring.application.name=spa-catalog-service
server.port=${PORT:${SERVER_PORT:8082}}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

# ---- Base de datos (MySQL por defecto) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spa_backend_bd}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Nunca imprimir SQL: puede contener datos personales.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT (mismo secreto en todos los microservicios; minimo 32 caracteres) ----
security.jwt.secret=${JWT_SECRET}

# ---- Carta de servicios ----
catalog.seed.enabled=${CATALOG_SEED_ENABLED:true}

# ---- Actuator: solo /health, sin detalles ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Swagger: apagado por defecto (activar con SWAGGER_ENABLED=true solo en desarrollo) ----
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
